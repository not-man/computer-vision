    position_plan: [465, 264]
    yaw_deg: 90
    points:
      - {image: [1000, 247], plan: [314, 406]}  # юго-западный угол зала
    lines:
      - {image: [[810, 250], [900, 247], [1000, 247]], plan: [[314, 406], [579, 406]]}  # южная стена
      - {image: [[1205, 462], [1260, 545]], plan: [[314, 261], [314, 406]]}  # западная стена
  camera_new_2:
