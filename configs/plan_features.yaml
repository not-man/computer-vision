# Соответствия кадров и плана для scripts/fit_cameras.py.
# Края открытых дверей не использовать: угол открытия неизвестен, надёжны только петли.
# image: пиксели исходного кадра 1296×972 (с дисторсией). plan: пиксели office_camera.png.
plan_px_per_m: 29.0  # три отрезка по 1,200 мм занимают на плане точки 182, 217, 252, 287
# Чистый план без значков камер для показа: пиксель разметки = scale · пиксель office.jpg + (dx, dy)
plan_image: {scale: 2.0, dx: 4.0, dy: 2.0}

# Стол стоит на высоте 0.76 м, размер стандартный; положение на плане неизвестно и подбирается
table:
  size_m: [2.74, 1.525]
  height_m: 0.76
  corners:  # порядок: СВ, СЗ, ЮЗ, ЮВ
    camera_new_1: [[380, 535], [943, 418], [800, 250], [345, 305]]
    camera_new_2: [[1022, 387], [690, 465], [888, 698], [1175, 518]]

cameras:
