[project]
name = "mct"
version = "0.1.0"
description = "Сквозной трекинг людей по нескольким камерам"
requires-python = ">=3.11,<3.12"
license = "AGPL-3.0-only"
dependencies = [
    "boxmot==26.0.0",
    "imageio-ffmpeg>=0.6",
    "matplotlib",  # только шрифт DejaVu с кириллицей для надписей на видео
    "lap>=0.5.12",  # трекеру Ultralytics; иначе он доустанавливает пакет сам, а без сети падает
    "numpy",
    "opencv-python==4.11.0.86",  # эту версию требует boxmot; второй пакет с модулем cv2 ставить нельзя: версия станет случайной
    "pandas",
    "pillow",
    "plotly",
    "pyarrow",
    "pycocotools",
    "pyyaml",
    "scipy",
    "streamlit",
    "ultralytics==8.4.203",
]

# Без extra torch приходит с PyPI: с CUDA на Linux. Для машины без GPU: uv sync --extra cpu
[project.optional-dependencies]
cpu = ["torch", "torchvision"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mct"]

[tool.pytest.ini_options]
testpaths = ["tests"]
